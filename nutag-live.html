<!DOCTYPE html>
<html lang="mn" data-style="nomad">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>MAZE APP</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; connect-src 'self' https://*.workers.dev https://*.vercel.app https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#070B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAZE APP">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600&subset=cyrillic&display=swap" rel="stylesheet">
<style>
:root{
  /* Минимал суурь (цайвар) */
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#0E1220; --mute:#6A7188; --line:#E4E7F0;
  --dune:#E0A02C; --sky:#1F5EFF; --green:#00C98D; --like:#F0456B;
  --bubble-me:linear-gradient(135deg,#1F5EFF,#6A3DF0); --bubble-them:#ECEFF7;
  --ring:conic-gradient(from 210deg,#E0A02C,#F0456B,#6A3DF0,#1F5EFF,#00C98D,#E0A02C);
  --glass:rgba(255,255,255,.78); --glow:0 8px 28px rgba(31,94,255,.18);
  --grad:linear-gradient(135deg,#1F5EFF,#6A3DF0);
  --r:22px;
  --display:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
/* Харанхуй неон (Gen Z) + Монгол хөх/алт */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070B16; --surface:#0F1526; --ink:#EAF0FF; --mute:#8C96B5; --line:#1D2540;
    --dune:#FFC65C; --sky:#37E6E0; --green:#5CFFB0; --like:#FF5C8A;
    --bubble-me:linear-gradient(135deg,#2B7BFF,#7B5CFF); --bubble-them:#18203A;
    --ring:conic-gradient(from 210deg,#FFC65C,#FF5C8A,#7B5CFF,#37E6E0,#5CFFB0,#FFC65C);
    --glass:rgba(15,21,38,.72); --glow:0 0 28px rgba(55,230,224,.22);
    --grad:linear-gradient(135deg,#2B7BFF,#7B5CFF);
  }
}
:root[data-theme="dark"]{
  --bg:#070B16; --surface:#0F1526; --ink:#EAF0FF; --mute:#8C96B5; --line:#1D2540;
  --dune:#FFC65C; --sky:#37E6E0; --green:#5CFFB0; --like:#FF5C8A;
  --bubble-me:linear-gradient(135deg,#2B7BFF,#7B5CFF); --bubble-them:#18203A;
  --ring:conic-gradient(from 210deg,#FFC65C,#FF5C8A,#7B5CFF,#37E6E0,#5CFFB0,#FFC65C);
  --glass:rgba(15,21,38,.72); --glow:0 0 28px rgba(55,230,224,.22);
  --grad:linear-gradient(135deg,#2B7BFF,#7B5CFF);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
html,body{touch-action:manipulation}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.mute{color:var(--mute)}

#app{position:fixed;left:0;right:0;top:var(--vt,0px);bottom:var(--vb,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:clip}
#app::before{content:"";position:absolute;inset:-20% -30% auto -30%;height:340px;background:radial-gradient(closest-side,rgba(123,92,255,.22),transparent),radial-gradient(closest-side at 80% 30%,rgba(55,230,224,.16),transparent);pointer-events:none;z-index:0}
#hd,#main,#nav{position:relative;z-index:1}
#hd{display:flex;align-items:center;gap:10px;padding:10px 18px;background:transparent;min-height:60px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{flex:none}
.title{font-family:var(--display);font-weight:500;font-size:17px}
#main{flex:1;min-width:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
#main.thread{overflow:hidden;display:flex;flex-direction:column}
#nav{display:flex;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;margin:0 14px 12px;padding:4px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;color:var(--mute);position:relative;border-radius:22px;transition:background .2s,color .2s}
#nav button.on{color:var(--ink);font-weight:600;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
#nav button.on svg{color:var(--sky);filter:drop-shadow(0 0 6px var(--sky))}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--like);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:600;box-shadow:0 0 10px var(--like)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ib:hover{border-color:var(--sky)}

/* hex avatars */
.hx{position:relative;display:inline-grid;place-items:center;width:var(--s);height:calc(var(--s)*.866);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);color:#fff;font-weight:600;font-family:var(--display);flex:none;line-height:1}
.hx-a{position:absolute;inset:calc(var(--s)*.05*.866) calc(var(--s)*.05);background:var(--surface);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hx-b{position:absolute;inset:calc(var(--s)*.04*.866) calc(var(--s)*.04);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:grid;place-items:center}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 18px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;width:68px;flex:none;color:var(--ink)}
.st span.n{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.st .plus{position:relative}
.st .plus i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;border:2px solid var(--bg);box-shadow:var(--glow)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:10px 14px}
.composer{padding:14px 16px}
.composer .top{display:flex;gap:12px;align-items:flex-start}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;outline:none;padding:8px 0;font-size:16px}
.composer textarea::placeholder{color:var(--mute)}
.composer .bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--bg);font-size:14px;color:var(--sky);cursor:pointer;border:1px solid var(--line)}
.btn{padding:10px 20px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--glow);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--sky);border:1px solid var(--sky);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.line{background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:none}
#prev img{width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-top:8px;display:block}

.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:12px 14px;padding:14px 0 4px;overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:0 16px}
.ph b{display:block;font-weight:600;line-height:1.2}
.ph span{font-size:13px}
.post p{margin:10px 16px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.art{margin-top:12px;aspect-ratio:5/3;overflow:hidden;background:var(--line)}
.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
.pa{display:flex;padding:4px 8px}
.pa button{display:flex;align-items:center;gap:6px;padding:10px 12px;color:var(--mute);font-size:14px;border-radius:12px}
.pa button.liked{color:var(--like);filter:drop-shadow(0 0 6px var(--like))}
.cms{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px}
.cm{display:flex;gap:8px;align-items:flex-start}
.cm .bb{background:var(--bg);border-radius:16px;padding:7px 13px;font-size:14px}
.cm .bb b{font-weight:600;display:block;font-size:13px}
.cmf{display:flex;gap:8px}
.cmf input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;outline:none;min-width:0}
.cmf input:focus{border-color:var(--sky)}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}

/* friends / chat lists */
.sec{padding:16px 18px 8px;font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:0 14px 8px;width:calc(100% - 28px);text-align:left}
.row .rt{flex:1;min-width:0}
.row .rt b{font-weight:600;display:block}
.row .rt span{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:6px;box-shadow:0 0 8px var(--green)}
.unread{min-width:22px;height:22px;border-radius:11px;background:var(--grad);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 7px;font-weight:600}
.search{margin:8px 14px 4px;display:block;width:calc(100% - 28px);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;outline:none}
.search:focus{border-color:var(--sky);box-shadow:var(--glow)}

/* thread */
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 14px;border-radius:20px;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--bubble-me);color:#fff;border-bottom-right-radius:6px}
.b.them{align-self:flex-start;background:var(--bubble-them);border-bottom-left-radius:6px}
.tm{font-size:11px;color:var(--mute);align-self:center;margin:6px 0 2px}
.typing{font-size:13px;color:var(--mute);align-self:flex-start}
.mf{display:flex;gap:8px;padding:10px 14px 12px;background:transparent}
.mf input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;outline:none;min-width:0;font-size:16px}
.mf input:focus{border-color:var(--sky)}
.mf button{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--glow)}

/* profile */
.cover{height:150px;overflow:hidden;margin:0 14px;border-radius:var(--r)}
.cover svg{width:100%;height:100%;display:block}
.pinfo{background:transparent;padding:0 18px 16px}
.pinfo .av{margin-top:-40px;display:block;height:78px;position:relative;margin-left:10px}
.pinfo h2{font-family:var(--display);font-weight:600;font-size:21px;margin:8px 0 0;letter-spacing:-.02em}
.pinfo p{margin:8px 0 0}
.stats{display:flex;gap:10px;margin:16px 0}
.stats>*{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stats b{font-family:var(--display);font-weight:600;font-size:18px;display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:12.5px;color:var(--mute)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}

/* overlay */
#ov{position:fixed;left:0;right:0;top:var(--vt,0px);bottom:var(--vb,0px);z-index:50;display:none}
.kb #app{padding-bottom:0}
.kb .sheet{padding-bottom:30px}
#ov.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(3,6,14,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px 0 2px}
.sheet h3{margin:0;font-family:var(--display);font-weight:500;font-size:16px}
.sheet textarea,.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;outline:none;width:100%;font-size:16px}
.sheet textarea:focus,.sheet input:focus{border-color:var(--sky)}
.sheet textarea{min-height:90px;resize:none}
.sheet label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:10px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.sv{position:absolute;inset:0;max-width:480px;margin:0 auto;color:#fff;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 24px}
.sbars{display:flex;gap:4px;position:relative;z-index:3}
.sb{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sb i{display:block;height:100%;width:0;background:#fff}
.sb.done i{width:100%}
.sb.on i{animation:fill 4.5s linear forwards}
@keyframes fill{to{width:100%}}
.shead{display:flex;align-items:center;gap:10px;margin-top:12px;position:relative;z-index:3}
.shead b{font-weight:600}
.shead span{opacity:.8;font-size:13px}
.shead .ib{margin-left:auto;color:#fff;background:rgba(255,255,255,.14);border-color:transparent}
.stext{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:500;font-size:24px;line-height:1.35;padding:0 12px;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.sz{position:absolute;top:90px;bottom:0;width:50%;z-index:2}
.sz.l{left:0}.sz.r{right:0}

.call{position:absolute;inset:0;max-width:480px;margin:0 auto;background:#05070E;color:#fff;overflow:hidden}
.call #rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05070E}
.call #lv{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:100px;height:140px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.4);transform:scaleX(-1);background:#111;z-index:2}
.cinfo{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:18px;z-index:2;display:flex;flex-direction:column;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.cinfo b{font-family:var(--display);font-weight:500;font-size:18px}
.cinfo span{font-size:13px;opacity:.85}
.cbar{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:18px;z-index:2}
.cb{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center}
.cb.off{background:#fff;color:#111}
.cb.end{background:#F0456B}
.cb.end svg{transform:rotate(135deg)}
.call.audio{background:radial-gradient(circle at 50% 35%,#1b2a55,#05070E 70%)}
.call.audio #rv{width:1px;height:1px;opacity:0;pointer-events:none}
.call .cav{position:absolute;left:0;right:0;top:26%;display:flex;justify-content:center;z-index:1}
.tapplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.crow{display:flex;gap:10px}.crow .btn{flex:1;padding:13px}
.ph .del+.del{margin-left:0}
.ph [data-a="user"]{cursor:pointer}
.rxs{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:6px}
.rxb{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.rxb.mine{border-color:var(--sky)}
.rxp{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin:4px 0;width:max-content;max-width:100%}
.rxp button{font-size:20px;padding:4px 6px;border-radius:50%}
.post .rxp{margin:0 16px 8px}
.mw{display:flex;flex-direction:column;max-width:82%}
.mw.me{align-self:flex-end;align-items:flex-end}
.mw.them{align-self:flex-start;align-items:flex-start}
.mline{display:flex;align-items:center;gap:4px;max-width:100%}
.mw.me .mline{flex-direction:row-reverse}
.mline .b{align-self:auto;max-width:100%}
.mrxb{color:var(--mute);opacity:.55;padding:4px;border-radius:50%;flex:none}
.mrxb:hover{opacity:1}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.mdel{font-style:italic;color:var(--mute);font-size:14px}
.mn{font-size:12px;color:var(--mute);margin:0 8px 2px}
.seenl{font-size:11px;color:var(--mute);margin:2px 6px 0}
.b audio{display:block;width:210px;max-width:100%;height:36px;margin-bottom:2px}
.mimg{display:block;max-width:100%;max-height:260px;border-radius:14px;margin-bottom:4px;cursor:zoom-in}
.mf .ib{width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;cursor:pointer;flex:none}
.recbar{flex:1;display:flex;align-items:center;justify-content:center;color:var(--like);font-weight:600}
.recbar i{width:10px;height:10px;border-radius:50%;background:var(--like);margin-right:8px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.chatbar{display:flex;align-items:center;gap:8px;padding-right:14px}
.chatbar .search{flex:1;width:auto;margin-right:0}
.zoom{position:absolute;inset:0;margin:auto;max-width:96%;max-height:88%;border-radius:12px;z-index:1}
.phrow{display:flex;align-items:center;gap:14px}
.pick{display:flex;flex-direction:column;gap:4px;max-height:38vh;overflow:auto}
.sheet label.pk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px;padding:6px 2px}
.pick input{width:auto;padding:0}
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:18px;padding:32px 24px}
.auth .logo{font-size:30px;gap:10px}
.auth .lead{margin:0;color:var(--mute)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:999px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.auth form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.fld input{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;outline:none;font-size:16px;color:var(--ink)}
.fld input:focus{border-color:var(--sky);box-shadow:var(--glow)}
.aerr{color:var(--like);font-size:14px;min-height:20px}
.auth .btn{padding:14px 18px;font-size:15px}
.auth .btn:disabled{opacity:.6}
.note{font-size:12.5px;color:var(--mute);margin:0}

/* ---------- хөдөлгөөн ---------- */
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.86);opacity:.7}}
@keyframes navpop{0%{transform:translateY(3px) scale(.8)}60%{transform:translateY(-2px) scale(1.12)}100%{transform:none}}
.pgin>*{animation:pgin .3s cubic-bezier(.2,.8,.2,1) both}
.pgin>*:nth-child(2){animation-delay:.04s}.pgin>*:nth-child(3){animation-delay:.08s}.pgin>*:nth-child(4){animation-delay:.12s}
.pgin #posts>.post:nth-child(-n+6),.pgin #flist>.row:nth-child(-n+8),.pgin #clist>.row:nth-child(-n+8){animation:pgin .34s cubic-bezier(.2,.8,.2,1) both}
.pgin #posts>.post:nth-child(2),.pgin #flist>.row:nth-child(2),.pgin #clist>.row:nth-child(2){animation-delay:.05s}
.pgin #posts>.post:nth-child(3),.pgin #flist>.row:nth-child(3),.pgin #clist>.row:nth-child(3){animation-delay:.1s}
.pgin #posts>.post:nth-child(n+4),.pgin #flist>.row:nth-child(n+4),.pgin #clist>.row:nth-child(n+4){animation-delay:.14s}
#ov.open .scrim{animation:fadein .22s ease both}
#ov.open .sheet{animation:sheetup .28s cubic-bezier(.2,.9,.25,1) both}
#ov.open.nosl .scrim,#ov.open.nosl .sheet{animation:none}
.auth{animation:fadein .35s ease both}
.btn:active,.chip:active,.ib:active{transform:scale(.95)}
.btn,.chip,.ib,.row,.pa button{transition:transform .15s,background .2s,color .2s,box-shadow .2s}
.row:active{transform:scale(.985)}
.pa button.liked svg{animation:pop .35s ease}
#nav button.on svg{animation:navpop .35s ease}
#toast{transform:translate(-50%,10px);transition:opacity .2s,transform .25s}
#toast.on{transform:translate(-50%,0)}
.ld{display:grid;place-items:center;padding:56px 0;position:relative}
.ld .ring{width:52px;height:52px;animation:spin .9s linear infinite}
.ld .ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ld .ring .t{stroke:var(--line)}
.ld .ring .a{stroke:var(--sky);stroke-dasharray:32 200}
.ld .mk{position:absolute;width:24px;height:24px;animation:breathe 1.4s ease-in-out infinite}
.ld.sm{padding:24px 0}.ld.sm .ring{width:34px;height:34px}.ld.sm .mk{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sb.on i{width:100%}}

/* ===== Орчин үеийн засал ===== */
:root{--r:24px;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.35);--ease:cubic-bezier(.22,.8,.3,1)}
body{letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
#hd{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--line)}
.card,.post,.row{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.post{margin:14px 14px;padding-top:16px}
.post .ph b{font-size:15px}
.post p{font-size:15.5px;line-height:1.55}
.pa{padding:6px 10px 8px;gap:2px}

.btn{transition:transform .18s var(--ease),box-shadow .18s,filter .18s}

.btn.line:hover,.chip:hover,.ib:hover{border-color:var(--sky)}
.ib{border-radius:16px;transition:transform .15s var(--ease),border-color .18s}
.ib:active{transform:scale(.92)}
.row{border-radius:20px;transition:transform .15s var(--ease),background .18s}
.row:active{transform:scale(.985)}
.composer{padding:16px 18px}
.chip{transition:border-color .18s,background .18s}
.search,.cmf input,.mf input{transition:border-color .18s,box-shadow .18s}
.tabs2{gap:6px}
.tabs2 button{border-radius:999px;transition:background .18s,color .18s}
.sheet{border-radius:32px 32px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.b{border-radius:20px;line-height:1.4}

.stats>*{border-radius:20px;box-shadow:var(--shadow)}
.sec{letter-spacing:.09em;font-size:12px}
::-webkit-scrollbar{width:0;height:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Загварууд: data-style = glass (үндсэн) | minimal | card ===== */
/* Минимал: хавтгай, нимгэн зураас, сүүдэр/гэрэлгүй, нэг өнгө */
:root[data-style="minimal"]{--r:14px;--shadow:none;--glow:none;--grad:linear-gradient(var(--sky),var(--sky));--bubble-me:var(--sky);--ring:conic-gradient(var(--sky),var(--sky))}

:root[data-style="card"] .chip,:root[data-style="card"] .tabs2 button{border-color:transparent;background:var(--surface);box-shadow:var(--shadow)}
:root[data-style="card"] .tabs2 button.on{background:var(--grad)}

/* ===== Загвар "Нутаг" (үндсэн): дулаан цаас, хавтгай хэвлэлийн маяг, дугуй аватар ===== */
:root[data-style="nomad"]{--bg:#F3EEE3;--surface:#FBF8F1;--ink:#1D1B16;--mute:#7C7565;--line:#E1D8C6;--dune:#C8912B;--sky:#1E48C8;--green:#2E9E6B;--like:#D2453D;--bubble-me:#1E48C8;--bubble-them:#E8E0CE;--glass:#F3EEE3;--glow:none;--grad:linear-gradient(#1E48C8,#1E48C8);--ring:conic-gradient(#C8912B,#D2453D,#1E48C8,#C8912B);--r:6px;--shadow:none;--display:'Unbounded','Montserrat',system-ui,sans-serif;--body:'Manrope','Montserrat',system-ui,sans-serif}

  return Object.entries(m).map(([e,us])=>`<span class="rxb ${us.includes(S.me.uid)?'mine':''}">${e}${us.length>1?' '+us.length:''}</span>`).join('')}
const rxPick=(k,id)=>`<div class="rxp">${EMO.map(e=>`<button data-a="rx" data-k="${k}" data-id="${esc(id)}" data-e="${e}">${e}</button>`).join('')}</div>`;
async function cropSq(file,n){
  const im=await loadImg(file),k=Math.min(im.width,im.height);
  return drawTo(im,n,n,(im.width-k)/2,(im.height-k)/2,k,k).toDataURL('image/jpeg',.72);
}

function notes(){

  const rq=[...S.chats.values()].filter(c=>isReq(c)&&!hid(c.peer));

function storyGroups(){
  const m=new Map();S.stories.filter(s=>!hid(s.uid)).forEach(s=>{if(!m.has(s.uid))m.set(s.uid,{uid:s.uid,name:s.name,list:[]});m.get(s.uid).list.push(s)});
  const gs=[...m.values()];gs.forEach(g=>{g.list.sort((a,b)=>a.t-b.t);g.latest=g.list[g.list.length-1].t});
  gs.sort((a,b)=>a.uid===S.me.uid?-1:b.uid===S.me.uid?1:b.latest-a.latest);return gs;
}

function personAction(uid,name){
  const chat=`<button class="btn sm line" data-a="thread" data-id="${esc(uid)}" data-n="${esc(name)}">Чат</button>`;
  if(S.friends.has(uid))return chat;
  const dm=(U.get(uid)||{}).dm!=='friends'?chat:'',inc=S.reqIn.find(r=>r.from===uid);
  if(inc)return dm+`<button class="btn sm" data-a="accept" data-id="${esc(inc.id)}">Зөвшөөрөх</button>`;
  if(S.reqOut.has(uid))return dm+`<button class="btn sm line" disabled>Илгээсэн</button>`;
  return dm+`<button class="btn sm ghost" data-a="add" data-id="${esc(uid)}" data-n="${esc(name)}">Нэмэх</button>`;
}
function friendLists(){

  let h='';
  const ri=S.reqIn.filter(r=>f(r.fromName)&&!hid(r.from));
  if(ri.length)h+=`<div class="sec">Найзын хүсэлт</div>`+ri.map(r=>row(r.from,r.fromName,`<button class="btn sm" data-a="accept" data-id="${esc(r.id)}">Зөвшөөрөх</button><button class="btn sm line" data-a="decline" data-id="${esc(r.id)}">Устгах</button>`)).join('');

  if(!all.length)return `<div class="empty">${q?'Олдсонгүй.':'Чат байхгүй байна. Найзууд хэсгээс хэн нэгнийг сонгож чат эхлүүл, эсвэл бүлэг үүсгэ.'}</div>`;
  const line=([cid,c])=>{const un=c.lastFrom&&c.lastFrom!==S.me.uid&&c.lastAt>(S.readMap[cid]||0),pr=cpref(cid);

const AUTH_ERR={'auth/email-already-in-use':'Энэ имэйл бүртгэлтэй байна. Нэвтрэх хэсгээр орно уу.','auth/invalid-email':'Имэйл хаяг буруу байна.','auth/weak-password':'Нууц үг хэт сул байна.','auth/password-does-not-meet-requirements':'Нууц үг хамгийн багадаа 8 тэмдэгт, том үсэг, жижиг үсэг болон тоо агуулсан байх ёстой.','auth/invalid-credential':'Имэйл эсвэл нууц үг буруу байна.','auth/user-not-found':'Имэйл эсвэл нууц үг буруу байна.','auth/wrong-password':'Имэйл эсвэл нууц үг буруу байна.','auth/too-many-requests':'Хэт олон оролдлого хийлээ. Түр хүлээгээд дахин оролдоно уу.','auth/network-request-failed':'Интернэт холболтоо шалгана уу.','auth/operation-not-allowed':'Firebase дээр Email/Password нэвтрэлт идэвхжээгүй байна.','auth/operation-not-supported-in-this-environment':'Файлыг http:// эсвэл https:// хаягаар нээнэ үү (file:// ажиллахгүй).'};
const amsg=(m,ok)=>{A.msg=m;A.ok=!!ok;const e=$('#amsg');if(e){e.textContent=m;e.className=ok?'aok':'aerr'}};
async function doAuth(f){
  const fd=new FormData(f),mode=f.dataset.f,e=(fd.get('e')||'').trim(),p=fd.get('p')||'',btn=f.querySelector('button[type=submit]');
  if(!e)return amsg('Имэйлээ оруулна уу.');
  if(mode==='reset'){btn.disabled=true;try{try{await AU.sendPasswordResetEmail(auth,e,{url:location.origin+location.pathname,handleCodeInApp:false})}catch(y){if(y.code!=='auth/unauthorized-continue-uri'&&y.code!=='auth/invalid-continue-uri')throw y;await AU.sendPasswordResetEmail(auth,e)}amsg('Сэргээх холбоосыг имэйл рүү илгээлээ. Ирэхгүй бол Спам хавтсаа шалгаарай.',true)}catch(x){amsg(AUTH_ERR[x.code]||'Илгээж чадсангүй.')}btn.disabled=false;return}
  if(!p)return amsg('Нууц үгээ оруулна уу.');
  if(mode==='login'){btn.disabled=true;try{await AU.signInWithEmailAndPassword(auth,e,p)}catch(x){amsg(AUTH_ERR[x.code]||'Нэвтэрч чадсангүй. Дахин оролдоно уу.');btn.disabled=false}return}
  const n=(fd.get('n')||'').trim();
  if(!n)return amsg('Нэрээ оруулна уу.');
  if(p.length<8||!/[a-z]/.test(p)||!/[A-Z]/.test(p)||!/[0-9]/.test(p))return amsg('Нууц үг хамгийн багадаа 8 тэмдэгт, том үсэг, жижиг үсэг болон тоо агуулсан байх ёстой.');
  if(p!==(fd.get('p2')||''))return amsg('Хоёр нууц үг таарахгүй байна.');
  btn.disabled=true;regBusy=true;
  try{
    const cred=await AU.createUserWithEmailAndPassword(auth,e,p);
    try{
      await FS.setDoc(FS.doc(db,'users',cred.user.uid),{name:n,nameLower:n.toLowerCase(),bio:'',createdAt:FS.serverTimestamp()});
    }catch(x){regBusy=false;await AU.signOut(auth);amsg('Профайл үүсгэж чадсангүй. Firestore-ийн дүрмээ (rules) шалгана уу.');btn.disabled=false;return}
    regBusy=false;AU.sendEmailVerification(cred.user).catch(()=>{});await startSession(cred.user);
  }catch(x){regBusy=false;amsg(AUTH_ERR[x.code]||'Бүртгэл үүсгэж чадсангүй. Дахин оролдоно уу.');btn.disabled=false}
}

function makeCall(id,peer,name,local,mine,audio){

async function deleteAccount(pw){
  const u=auth.currentUser,uid=S.me.uid,{collection,collectionGroup,query,where,getDocs,doc,writeBatch,deleteDoc,updateDoc,arrayRemove,limit}=FS;
  await AU.reauthenticateWithCredential(u,AU.EmailAuthProvider.credential(u.email,pw));   // нууц үг буруу бол энд зогсно
  toast('Өгөгдлийг устгаж байна…',120000);
  clearInterval(hbT);recStop(false);endCall(true);unsubAll();
  const docs=async q=>(await getDocs(q)).docs;
  const del=async refs=>{for(let i=0;i<refs.length;i+=400){const b=writeBatch(db);refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}};
  const all=(col,f,op,v)=>docs(query(collection(db,col),where(f,op,v)));
  const warn=[];
  // нийтлэл + доорх сэтгэгдлүүд
  for(const p of await all('posts','uid','==',uid)){await del((await docs(collection(db,'posts',p.id,'comments'))).map(d=>d.ref));await del([p.ref])}
  // бусдын нийтлэл дээрх миний сэтгэгдлүүд
  try{await del((await docs(query(collectionGroup(db,'comments'),where('uid','==',uid)))).map(d=>d.ref))}
  catch(e){
    // индекс бэлэн биш үед: сүүлийн нийтлэл бүрийн сэтгэгдлийг шалгана
    console.warn('comments group query',e&&e.code);
    try{for(const p of await docs(query(collection(db,'posts'),limit(300))))await del((await docs(query(collection(db,'posts',p.id,'comments'),where('uid','==',uid)))).map(d=>d.ref))}
    catch(e2){warn.push('comments');console.warn('comments cleanup',e2&&e2.code)}
  }
  await del((await all('stories','uid','==',uid)).map(d=>d.ref));
  await del((await all('requests','from','==',uid)).map(d=>d.ref));
  await del((await all('requests','to','==',uid)).map(d=>d.ref));
  await del((await all('friendships','members','array-contains',uid)).map(d=>d.ref));
  await del((await all('blocks','by','==',uid)).map(d=>d.ref));
  // чатууд: миний мессежүүд, 1:1 чат өөрөө; бүлгээс гарна
  for(const c of await all('chats','members','array-contains',uid)){
    await del((await docs(query(collection(db,'chats',c.id,'messages'),where('from','==',uid)))).map(d=>d.ref));
    if(c.data().group)await updateDoc(c.ref,{members:arrayRemove(uid)});else await del([c.ref]);
  }
  // дуудлагууд (ICE мэдээлэл IP хаяг агуулдаг тул хамт устгана)
  for(const fld of ['from','to'])for(const c of await all('calls',fld,'==',uid)){
    for(const sub of ['callerCandidates','calleeCandidates'])await del((await docs(collection(db,'calls',c.id,sub))).map(d=>d.ref));
    await del([c.ref]);
  }
  await del((await docs(collection(db,'users',uid,'fcm'))).map(d=>d.ref));
  await deleteDoc(doc(db,'users',uid));
  await AU.deleteUser(u);
  try{localStorage.removeItem('nutag-read-'+uid);localStorage.removeItem('nutag-seen-'+uid)}catch(_){}
  return warn;
}

async function recStart(){
  if(rec)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Энэ төхөөрөмж дуу бичихийг дэмжихгүй байна',3000);return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(_){toast('Микрофоны зөвшөөрөл өгнө үү',3500);return}
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000}),chunks=[];
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const r={mr,st,chunks,t0:Date.now(),send:false};rec=r;
  mr.onstop=async()=>{
    st.getTracks().forEach(t=>t.stop());clearInterval(r.iv);if(rec===r)rec=null;if(S.thread)renderMf();
    if(!r.send||!chunks.length)return;
    const blob=new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'});
    if(blob.size>600000){toast('Хэт урт байна');return}
    const d=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});
    try{await sendMsg({aud:d})}catch(_){toast('Илгээж чадсангүй')}
  };
  mr.start();renderMf();
  r.iv=setInterval(()=>{const s=Math.floor((Date.now()-r.t0)/1000),e=$('#rt');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=60)recStop(true)},500);
}
function recStop(send){if(rec){rec.send=send;try{rec.mr.stop()}catch(_){rec=null}}}

      const bt=writeBatch(db);

      await bt.commit();
    }
    if(k==='sreply'){const inp=$('#sri'),t=inp?inp.value.trim():'';if(!t)return;inp.value='';
      try{await storyReply(t);S.sv&&nextStory()}catch(x){inp.value=t;throw x}return}
    if(k==='msg'){
      const inp=$('#mi'),t=inp?inp.value.trim():'';if(!t)return;inp.value='';
      try{await sendMsg({text:t})}catch(x){inp.value=t;throw x}
    }
  }catch(err){console.error(err);toast('Илгээж чадсангүй. Дахин оролдоно уу.',3000)}
});
document.addEventListener('focusin',e=>{if(e.target.id==='sri')clearTimeout(svT)});
document.addEventListener('input',e=>{
  if(e.target.id==='rvol'){RING.vol=+e.target.value;lsSet('maze-ring',RING)}
  if(e.target.id==='fq'){S.q=e.target.value;refreshFriends()}
  if(e.target.id==='mq'){S.mq=e.target.value;refreshMsgs()}
  if(e.target.id==='pq'){S.pq=e.target.value;refreshPosts()}
  if(e.target.id==='cq'){S.cq=e.target.value;refreshChats()}
  if(e.target.id==='mi'&&e.target.value)typingPing();
});
setInterval(()=>{if(S.me&&S.thread&&!document.hidden)setTyping()},2000);
setInterval(()=>{if(S.me&&!S.thread&&!document.hidden){refreshFriends();refreshChats()}},30000);
const offb=()=>{const e=$('#offb');if(e)e.classList.toggle('on',!navigator.onLine)};
addEventListener('online',offb);addEventListener('offline',offb);offb();
document.addEventListener('visibilitychange',()=>{if(S.me&&S.thread&&!document.hidden)markRead(S.thread.cid)});
document.addEventListener('change',async e=>{
  if(e.target.id==='file'){
    const fs=[...e.target.files];if(!fs.length)return;
    try{const room=4-S.draftImgs.length,multi=fs.length>1||S.draftImgs.length>0;
      for(const f of fs.slice(0,room))S.draftImgs.push(await downscale(f,multi?720:900,multi?170000:700000));
      if(fs.length>room)toast('Хамгийн ихдээ 4 зураг');drawPrev()}catch(er){console.warn('post image',er);toast('Зургийг уншиж чадсангүй. Өөр зураг сонгоно уу.',3500)}
    e.target.value='';
  }
  if(e.target.id==='sfile'){
    const f=e.target.files[0];if(!f)return;
    try{S.draftStory=await downscale(f,720,250000);const p=$('#sprev');if(p)p.innerHTML=`<div class="pv"><img src="${S.draftStory}" alt="Story зураг" style="width:100%;height:160px"></div>`}catch(er){console.warn('story image',er);toast('Зургийг уншиж чадсангүй.',3000)}
    e.target.value='';
  }
  if(e.target.id==='mfile'){
    const f=e.target.files[0];if(!f||!S.thread)return;
    try{const d=await downscale(f);await sendMsg({img:d})}catch(er){console.warn('chat image',er);toast('Зураг илгээж чадсангүй',3000)}
    e.target.value='';
  }
  if(e.target.id==='gfile'){
    const f=e.target.files[0];if(!f)return;
    try{S.draftGroup=await cropSq(f,160);const ph=$('.phrow');if(ph&&ph.firstElementChild)ph.firstElementChild.outerHTML=`<span class="hx" style="--s:56px;background:url('${S.draftGroup}') center/cover"></span>`;toast('Зураг сонгогдлоо')}catch(er){console.warn('group photo',er);toast('Зургийг уншиж чадсангүй. Өөр зураг сонгоно уу.',3500)}
  }
  if(e.target.id==='pfile'){
    const f=e.target.files[0];if(!f)return;
    try{S.draftPhoto=await cropSq(f,160);const ph=$('.phrow');if(ph&&ph.firstElementChild)ph.firstElementChild.outerHTML=`<span class="hx" style="--s:56px;background:url('${S.draftPhoto}') center/cover"></span>`;toast('Зураг сонгогдлоо. Хадгалах дарна уу.')}catch(er){console.warn('photo',er);toast('Зургийг уншиж чадсангүй. Өөр зураг сонгоно уу.',3500)}
  }
});

/* ---------- эхлүүлэлт ---------- */
async function main(){
  try{const st=localStorage.getItem('maze-style');if(st)document.documentElement.dataset.style=st}catch(_){}
  try{const t=localStorage.getItem('nutag-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
  if(!configured&&!window.__FB_MOCK){setupRender();return}
  $('#main').innerHTML='<div style="min-height:70vh;display:grid;align-items:center">'+loader()+'</div>';
  try{
    const fb=await loadFirebase();
    const app=fb.app.initializeApp(CFG);FBAPP=app;AU=fb.auth;FS=fb.fs;auth=AU.getAuth(app);auth.languageCode="mn";db=FS.getFirestore(app);
  }catch(e){console.error(e);$('#main').innerHTML='<div class="empty">Firebase ачаалж чадсангүй. Интернэт холболтоо шалгаад хуудсаа дахин ачаална уу.</div>';return}
  AU.onAuthStateChanged(auth,async u=>{
    if(regBusy)return;
    if(u)await startSession(u);else{endSession();render()}
  });
}
main();
startUpdater();

</script>
</body>
</html>
