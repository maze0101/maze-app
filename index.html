<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>MAZE APP</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; frame-src https://*.firebaseapp.com https://*.web.app; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2F7D5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAZE APP">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&subset=cyrillic&display=swap" rel="stylesheet">
<style>
:root{
  /* Минимал суурь (цайвар) */
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#0E1220; --mute:#6A7188; --line:#E4E7F0;
  --dune:#E0A02C; --sky:#1F5EFF; --green:#00C98D; --like:#F0456B;
  --bubble-me:linear-gradient(135deg,#1F5EFF,#6A3DF0); --bubble-them:#ECEFF7;
  --ring:conic-gradient(from 210deg,#E0A02C,#F0456B,#6A3DF0,#1F5EFF,#00C98D,#E0A02C);
  --glass:rgba(255,255,255,.78); --glow:0 8px 28px rgba(31,94,255,.18);
  --grad:linear-gradient(135deg,#1F5EFF,#6A3DF0);
  --r:22px;
  --display:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Харанхуй неон (Gen Z) + Монгол хөх/алт */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070B16; --surface:#0F1526; --ink:#EAF0FF; --mute:#8C96B5; --line:#1D2540;
    --dune:#FFC65C; --sky:#37E6E0; --green:#5CFFB0; --like:#FF5C8A;
    --bubble-me:linear-gradient(135deg,#2B7BFF,#7B5CFF); --bubble-them:#18203A;
    --ring:conic-gradient(from 210deg,#FFC65C,#FF5C8A,#7B5CFF,#37E6E0,#5CFFB0,#FFC65C);
    --glass:rgba(15,21,38,.72); --glow:0 0 28px rgba(55,230,224,.22);
    --grad:linear-gradient(135deg,#2B7BFF,#7B5CFF);
  }
}
:root[data-theme="dark"]{
  --bg:#070B16; --surface:#0F1526; --ink:#EAF0FF; --mute:#8C96B5; --line:#1D2540;
  --dune:#FFC65C; --sky:#37E6E0; --green:#5CFFB0; --like:#FF5C8A;
  --bubble-me:linear-gradient(135deg,#2B7BFF,#7B5CFF); --bubble-them:#18203A;
  --ring:conic-gradient(from 210deg,#FFC65C,#FF5C8A,#7B5CFF,#37E6E0,#5CFFB0,#FFC65C);
  --glass:rgba(15,21,38,.72); --glow:0 0 28px rgba(55,230,224,.22);
  --grad:linear-gradient(135deg,#2B7BFF,#7B5CFF);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.mute{color:var(--mute)}

#app{height:var(--vh,100%);max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#app::before{content:"";position:absolute;inset:-20% -30% auto -30%;height:340px;background:radial-gradient(closest-side,rgba(123,92,255,.22),transparent),radial-gradient(closest-side at 80% 30%,rgba(55,230,224,.16),transparent);pointer-events:none;z-index:0}
#hd,#main,#nav{position:relative;z-index:1}
#hd{display:flex;align-items:center;gap:10px;padding:10px 18px;background:transparent;min-height:60px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{flex:none}
.title{font-family:var(--display);font-weight:500;font-size:17px}
#main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
#main.thread{overflow:hidden;display:flex;flex-direction:column}
#nav{display:flex;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;margin:0 14px 12px;padding:4px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;color:var(--mute);position:relative;border-radius:22px;transition:background .2s,color .2s}
#nav button.on{color:var(--ink);font-weight:600;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
#nav button.on svg{color:var(--sky);filter:drop-shadow(0 0 6px var(--sky))}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--like);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:600;box-shadow:0 0 10px var(--like)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ib:hover{border-color:var(--sky)}

/* hex avatars */
.hx{position:relative;display:inline-grid;place-items:center;width:var(--s);height:calc(var(--s)*.866);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);color:#fff;font-weight:600;font-family:var(--display);flex:none;line-height:1}
.hx-a{position:absolute;inset:calc(var(--s)*.05*.866) calc(var(--s)*.05);background:var(--surface);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hx-b{position:absolute;inset:calc(var(--s)*.04*.866) calc(var(--s)*.04);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:grid;place-items:center}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 18px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;width:68px;flex:none;color:var(--ink)}
.st span.n{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.st .plus{position:relative}
.st .plus i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;border:2px solid var(--bg);box-shadow:var(--glow)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:10px 14px}
.composer{padding:14px 16px}
.composer .top{display:flex;gap:12px;align-items:flex-start}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;outline:none;padding:8px 0;font-size:16px}
.composer textarea::placeholder{color:var(--mute)}
.composer .bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--bg);font-size:14px;color:var(--sky);cursor:pointer;border:1px solid var(--line)}
.btn{padding:10px 20px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--glow);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--sky);border:1px solid var(--sky);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.line{background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:none}
#prev img{width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-top:8px;display:block}

.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:12px 14px;padding:14px 0 4px;overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:0 16px}
.ph b{display:block;font-weight:600;line-height:1.2}
.ph span{font-size:13px}
.post p{margin:10px 16px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.art{margin-top:12px;aspect-ratio:5/3;overflow:hidden;background:var(--line)}
.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
.pa{display:flex;padding:4px 8px}
.pa button{display:flex;align-items:center;gap:6px;padding:10px 12px;color:var(--mute);font-size:14px;border-radius:12px}
.pa button.liked{color:var(--like);filter:drop-shadow(0 0 6px var(--like))}
.cms{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px}
.cm{display:flex;gap:8px;align-items:flex-start}
.cm .bb{background:var(--bg);border-radius:16px;padding:7px 13px;font-size:14px}
.cm .bb b{font-weight:600;display:block;font-size:13px}
.cmf{display:flex;gap:8px}
.cmf input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;outline:none;min-width:0}
.cmf input:focus{border-color:var(--sky)}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}

/* friends / chat lists */
.sec{padding:16px 18px 8px;font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:0 14px 8px;width:calc(100% - 28px);text-align:left}
.row .rt{flex:1;min-width:0}
.row .rt b{font-weight:600;display:block}
.row .rt span{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:6px;box-shadow:0 0 8px var(--green)}
.unread{min-width:22px;height:22px;border-radius:11px;background:var(--grad);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 7px;font-weight:600}
.search{margin:8px 14px 4px;display:block;width:calc(100% - 28px);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;outline:none}
.search:focus{border-color:var(--sky);box-shadow:var(--glow)}

/* thread */
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 14px;border-radius:20px;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--bubble-me);color:#fff;border-bottom-right-radius:6px}
.b.them{align-self:flex-start;background:var(--bubble-them);border-bottom-left-radius:6px}
.tm{font-size:11px;color:var(--mute);align-self:center;margin:6px 0 2px}
.typing{font-size:13px;color:var(--mute);align-self:flex-start}
.mf{display:flex;gap:8px;padding:10px 14px 12px;background:transparent}
.mf input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;outline:none;min-width:0;font-size:16px}
.mf input:focus{border-color:var(--sky)}
.mf button{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--glow)}

/* profile */
.cover{height:150px;overflow:hidden;margin:0 14px;border-radius:var(--r)}
.cover svg{width:100%;height:100%;display:block}
.pinfo{background:transparent;padding:0 18px 16px}
.pinfo .av{margin-top:-40px;display:block;height:78px;position:relative;margin-left:10px}
.pinfo h2{font-family:var(--display);font-weight:600;font-size:21px;margin:8px 0 0;letter-spacing:-.02em}
.pinfo p{margin:8px 0 0}
.stats{display:flex;gap:10px;margin:16px 0}
.stats>*{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stats b{font-family:var(--display);font-weight:600;font-size:18px;display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:12.5px;color:var(--mute)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}

/* overlay */
#ov{position:fixed;inset:0;z-index:50;display:none}
#ov.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(3,6,14,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px 0 2px}
.sheet h3{margin:0;font-family:var(--display);font-weight:500;font-size:16px}
.sheet textarea,.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;outline:none;width:100%;font-size:16px}
.sheet textarea:focus,.sheet input:focus{border-color:var(--sky)}
.sheet textarea{min-height:90px;resize:none}
.sheet label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:10px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.sv{position:absolute;inset:0;max-width:480px;margin:0 auto;color:#fff;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 24px}
.sbars{display:flex;gap:4px;position:relative;z-index:3}
.sb{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sb i{display:block;height:100%;width:0;background:#fff}
.sb.done i{width:100%}
.sb.on i{animation:fill 4.5s linear forwards}
@keyframes fill{to{width:100%}}
.shead{display:flex;align-items:center;gap:10px;margin-top:12px;position:relative;z-index:3}
.shead b{font-weight:600}
.shead span{opacity:.8;font-size:13px}
.shead .ib{margin-left:auto;color:#fff;background:rgba(255,255,255,.14);border-color:transparent}
.stext{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:500;font-size:24px;line-height:1.35;padding:0 12px;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.sz{position:absolute;top:90px;bottom:0;width:50%;z-index:2}
.sz.l{left:0}.sz.r{right:0}

.call{position:absolute;inset:0;max-width:480px;margin:0 auto;background:#05070E;color:#fff;overflow:hidden}
.call #rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05070E}
.call #lv{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:100px;height:140px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.4);transform:scaleX(-1);background:#111;z-index:2}
.cinfo{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:18px;z-index:2;display:flex;flex-direction:column;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.cinfo b{font-family:var(--display);font-weight:500;font-size:18px}
.cinfo span{font-size:13px;opacity:.85}
.cbar{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:18px;z-index:2}
.cb{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center}
.cb.off{background:#fff;color:#111}
.cb.end{background:#F0456B}
.cb.end svg{transform:rotate(135deg)}
.tapplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.crow{display:flex;gap:10px}.crow .btn{flex:1;padding:13px}
.ph .del+.del{margin-left:0}
.ph [data-a="user"]{cursor:pointer}
.rxs{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:6px}
.rxb{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.rxb.mine{border-color:var(--sky)}
.rxp{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin:4px 0;width:max-content;max-width:100%}
.rxp button{font-size:20px;padding:4px 6px;border-radius:50%}
.post .rxp{margin:0 16px 8px}
.mw{display:flex;flex-direction:column;max-width:82%}
.mw.me{align-self:flex-end;align-items:flex-end}
.mw.them{align-self:flex-start;align-items:flex-start}
.mline{display:flex;align-items:center;gap:4px;max-width:100%}
.mw.me .mline{flex-direction:row-reverse}
.mline .b{align-self:auto;max-width:100%}
.mrxb{color:var(--mute);opacity:.55;padding:4px;border-radius:50%;flex:none}
.mrxb:hover{opacity:1}
.mn{font-size:12px;color:var(--mute);margin:0 8px 2px}
.seenl{font-size:11px;color:var(--mute);margin:2px 6px 0}
.b audio{display:block;width:210px;max-width:100%;height:36px;margin-bottom:2px}
.mimg{display:block;max-width:100%;max-height:260px;border-radius:14px;margin-bottom:4px;cursor:zoom-in}
.mf .ib{width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;cursor:pointer;flex:none}
.recbar{flex:1;display:flex;align-items:center;justify-content:center;color:var(--like);font-weight:600}
.recbar i{width:10px;height:10px;border-radius:50%;background:var(--like);margin-right:8px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.chatbar{display:flex;align-items:center;gap:8px;padding-right:14px}
.chatbar .search{flex:1;width:auto;margin-right:0}
.zoom{position:absolute;inset:0;margin:auto;max-width:96%;max-height:88%;border-radius:12px;z-index:1}
.phrow{display:flex;align-items:center;gap:14px}
.pick{display:flex;flex-direction:column;gap:4px;max-height:38vh;overflow:auto}
.sheet label.pk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px;padding:6px 2px}
.pick input{width:auto;padding:0}
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:18px;padding:32px 24px}
.auth .logo{font-size:30px;gap:10px}
.auth .lead{margin:0;color:var(--mute)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:999px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.auth form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.fld input{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;outline:none;font-size:16px;color:var(--ink)}
.fld input:focus{border-color:var(--sky);box-shadow:var(--glow)}
.aerr{color:var(--like);font-size:14px;min-height:20px}
.auth .btn{padding:14px 18px;font-size:15px}
.auth .btn:disabled{opacity:.6}
.note{font-size:12.5px;color:var(--mute);margin:0}

.link{color:var(--sky);font-size:14px;text-decoration:underline;align-self:flex-start;padding:4px 0}
.aok{color:var(--green);font-size:14px;min-height:20px}
.setup{padding:28px 22px 48px;background:var(--surface);min-height:100%}
.setup .logo{font-size:24px;gap:10px}
.setup h2{font-family:var(--display);font-weight:500;font-size:18px;margin:14px 0 4px}
.setup ol{padding-left:20px;display:flex;flex-direction:column;gap:12px;margin:14px 0 0}
.setup code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:13px;overflow-wrap:anywhere}
.ph .del{margin-left:auto;font-size:13px;color:var(--mute);padding:6px 8px}
.bt{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.b.me .bt{text-align:right}
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
#toast.on{opacity:1}

/* ---------- icons ---------- */
const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.7 0 4.5 1.8 4.5 4.5"/>',
 chat:'<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',

/* ---------- мэдэгдэл (апп нээлттэй үед) ---------- */
let swReg=null;
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
/* ---------- гар утасны гар (keyboard) ---------- */
(function(){
  const vv=window.visualViewport,root=document.documentElement;
  const fit=()=>{
    if(vv){root.style.setProperty('--vh',Math.round(vv.height)+'px');if(vv.offsetTop>0||window.scrollY>0)window.scrollTo(0,0)}
  };
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit()}
  document.addEventListener('focusin',e=>{
    const t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName)||!t.closest('.auth,.sheet'))return;
    [250,600].forEach(ms=>setTimeout(()=>{if(document.activeElement===t)t.scrollIntoView({block:'center',behavior:'smooth'})},ms));
  });
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||''))window.scrollTo(0,0)},100));
})();
/* ---------- автомат шинэчлэлт ---------- */
let pageHash=null,updT=null;
const hashStr=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length};
async function checkUpdate(){
  if(location.protocol==='file:'||!navigator.onLine)return;
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const h=hashStr(await r.text());
    if(pageHash===null){pageHash=h;return}
    if(h===pageHash)return;
    const a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=='file'&&a.value;
    if((typeof CALL!=='undefined'&&CALL)||(typeof INC!=='undefined'&&INC)||rec||typing){toast('Шинэ хувилбар бэлэн боллоо. Дараа нь автоматаар шинэчлэгдэнэ.',3500);return}
    toast('Шинэчилж байна…',1500);setTimeout(()=>location.reload(),600);
  }catch(_){}
}
function startUpdater(){
  if(location.protocol==='file:')return;
  checkUpdate();clearInterval(updT);updT=setInterval(checkUpdate,5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
  if(swReg)swReg.update().catch(()=>{});
}
const canNotify=()=>'Notification' in window;
function notify(title,body,tag){
  if(document.hidden&&canNotify()&&Notification.permission==='granted'){
    const o={body,tag,icon:'icon-192.png',badge:'icon-192.png'};
    try{if(swReg&&swReg.showNotification)swReg.showNotification(title,o);else new Notification(title,o)}catch(_){toast(title+': '+body,3500)}
  }else toast(title+': '+body,3500);
}
/* ---------- push (апп хаалттай үед): FCM токен бүртгэх ---------- */
let pushTok=null;
async function registerPush(){
  try{
    if(!canNotify()||Notification.permission!=='granted'||!('serviceWorker' in navigator)||!S.me||!FBAPP||location.protocol==='file:')return;
    const reg=swReg||await navigator.serviceWorker.ready;
    const m=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-messaging.js`);
    if(!(await m.isSupported()))return;
    const token=await m.getToken(m.getMessaging(FBAPP),{serviceWorkerRegistration:reg});
    if(!token||!S.me)return;
    pushTok=token;
    await FS.setDoc(FS.doc(db,'users',S.me.uid,'fcm',token),{t:FS.serverTimestamp(),ua:navigator.userAgent.slice(0,120)});
  }catch(e){console.warn('push register',e&&e.code||e)}
}
async function dropPush(){
  try{if(pushTok&&S.me)await FS.deleteDoc(FS.doc(db,'users',S.me.uid,'fcm',pushTok))}catch(_){}
  pushTok=null;
}
async function askNotify(){
  if(!canNotify()){toast('Энэ төхөөрөмж мэдэгдэл дэмжихгүй байна');return}
  const p=await Notification.requestPermission();
  toast(p==='granted'?'Мэдэгдэл асалаа':'Мэдэгдэл зөвшөөрөгдсөнгүй');if(p==='granted')registerPush();
  $('#hd').innerHTML=headerHTML();
}
const ic=(n,s=22,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- helpers ---------- */
const hashIdx=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h%PAL.length};
function av(uid,name,s=40,ring){
  const c=PAL[hashIdx(uid||name)],ph=(U.get(uid)||{}).photo,g=ph?`url('${ph}') center/cover`:`linear-gradient(135deg,${c[0]},${c[1]})`,ch=ph?'':esc([...(name||'?')][0].toUpperCase()),fs=Math.round(s*.4);
  if(!ring)return `<span class="hx" style="--s:${s}px;background:${g};font-size:${fs}px">${ch}</span>`;
  const rg=ring==='new'?'var(--ring)':'var(--line)';
  return `<span class="hx" style="--s:${s}px;background:${rg}"><span class="hx-a"><span class="hx-b" style="background:${g};font-size:${fs}px">${ch}</span></span></span>`;
}
function ago(ms){const s=Math.max(0,(Date.now()-ms)/1000);if(s<60)return 'Дөнгөж сая';const m=s/60;if(m<60)return Math.floor(m)+' мин';const h=m/60;if(h<24)return Math.floor(h)+' цаг';const d=h/24;if(d<7)return Math.floor(d)+' өдөр';return new Date(ms).toISOString().slice(0,10)}
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const tms=x=>x&&x.toMillis?x.toMillis():Date.now();
const tv=v=>typeof v==='number'?v:(v&&v.toMillis?v.toMillis():0);
const safeImg=s=>typeof s==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s)?s:'';
function toast(m,ms=1900){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms)}
function onErr(e){console.error(e);if(S.errShown)return;S.errShown=true;
  toast(e&&e.code==='permission-denied'?'Эрх хүрэхгүй байна. Firestore-ийн дүрмээ (rules) шалгана уу.':'Өгөгдөл уншиж чадсангүй. Интернэтээ шалгана уу.',4500)}
function cover(){return '<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C08E"/><stop offset="1" stop-color="#F8E6CB"/></linearGradient></defs><rect width="400" height="240" fill="url(#sd)"/><circle cx="300" cy="92" r="34" fill="#EE8656" opacity=".92"/><path d="M0 172 Q90 120 190 166 T400 150 V240 H0z" fill="#D9A867"/><path d="M0 207 Q120 162 250 202 T400 192 V240 H0z" fill="#B87F45"/></svg>'}
function downscale(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    let q=.75,d=cv.toDataURL('image/jpeg',q);while(d.length>700000&&q>.3){q-=.1;d=cv.toDataURL('image/jpeg',q)}
    res(d)};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- өгөгдлийн хөрвүүлэгч ---------- */
const mapPost=d=>{const x=d.data({serverTimestamps:'estimate'});return {id:d.id,uid:x.uid,name:x.name||'',text:x.text||'',img:x.img||'',likes:Array.isArray(x.likes)?x.likes:[],cc:x.cc||0,rx:x.rx||{},ed:!!x.edited,t:tms(x.createdAt)}};
const mapStory=d=>{const x=d.data({serverTimestamps:'estimate'});return {id:d.id,uid:x.uid,name:x.name||'',text:x.text||'',g:x.g|0,t:tms(x.createdAt)}};
const mapMsg=d=>{const x=d.data({serverTimestamps:'estimate'});return {id:d.id,f:x.from,t:x.text||'',img:x.img||'',aud:x.aud||'',fn:x.fn||'',rx:x.rx||{},ms:tms(x.createdAt)}};

const safeAud=s=>typeof s==='string'&&/^data:audio\/[^,;]{1,60}(;[^,]{1,60})?;base64,[A-Za-z0-9+\/=]+$/.test(s)?s:'';
const EMO=['👍','❤️','😂','😮','😢','🔥'];
function rxSum(rx){const m={};Object.entries(rx||{}).forEach(([u,e])=>{(m[e]=m[e]||[]).push(u)});
  return Object.entries(m).map(([e,us])=>`<span class="rxb ${us.includes(S.me.uid)?'mine':''}">${e}${us.length>1?' '+us.length:''}</span>`).join('')}
const rxPick=(k,id)=>`<div class="rxp">${EMO.map(e=>`<button data-a="rx" data-k="${k}" data-id="${esc(id)}" data-e="${e}">${e}</button>`).join('')}</div>`;
function cropSq(file,n){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const cv=document.createElement('canvas');cv.width=cv.height=n;const k=Math.min(im.width,im.height);
  cv.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,n,n);res(cv.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- views ---------- */
function unreadChats(){let n=0;S.chats.forEach((c,cid)=>{if(c.lastFrom&&c.lastFrom!==S.me.uid&&c.lastAt>(S.readMap[cid]||0))n++});return n}
function headerHTML(){
  if(S.thread)return `<button class="ib" data-a="back" aria-label="Буцах">${ic('back',24)}</button>${av(S.thread.uid,S.thread.name,38)}<b style="font-weight:600">${S.thread.group?'👥 ':''}${esc(S.thread.name)}${!S.thread.group&&typeof isOnline==='function'&&isOnline(S.thread.uid)?'<span class="dot" title="Онлайн"></span>':''}</b>${S.thread.group||hid(S.thread.uid)?'':`<button class="ib" style="margin-left:auto" data-a="call" aria-label="Видео дуудлага">${ic('video',22)}</button>`}`;
  if(S.view)return `<button class="ib" data-a="uback" aria-label="Буцах">${ic('back',24)}</button>${av(S.view.uid,S.view.name,38)}<b style="font-weight:600">${esc((U.get(S.view.uid)||S.view).name)}</b>`;
  if(S.tab==='feed')return `<div class="logo"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 24V4h20v20H10V10h8v6" fill="none" stroke="var(--sky)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="19" r="2.2" fill="var(--green)"/></svg>MAZE APP</div>${canNotify()&&Notification.permission==='default'?`<button class="ib" style="margin-left:auto" data-a="notif" aria-label="Мэдэгдэл асаах">${ic('bell',22)}</button>`:''}`;
  return `<div class="title">${{friends:'Найзууд',chat:'Чат',profile:'Профайл'}[S.tab]}</div>`;
}
function navHTML(){
  const items=[['feed','home','Мэдээ'],['friends','users','Найзууд'],['chat','chat','Чат'],['profile','user','Профайл']];
  const bd={friends:S.reqIn.length,chat:unreadChats()};
  return items.map(([k,i,l])=>`<button data-a="tab" data-t="${k}" class="${S.tab===k?'on':''}" ${S.tab===k?'aria-current="page"':''}>${ic(i,23)}<span>${l}</span>${bd[k]?`<span class="badge">${bd[k]}</span>`:''}</button>`).join('');
}
function storyGroups(){
  const m=new Map();S.stories.filter(s=>!hid(s.uid)).forEach(s=>{if(!m.has(s.uid))m.set(s.uid,{uid:s.uid,name:s.name,list:[]});m.get(s.uid).list.push(s)});
  const gs=[...m.values()];gs.forEach(g=>{g.list.sort((a,b)=>a.t-b.t);g.latest=g.list[g.list.length-1].t});
  gs.sort((a,b)=>a.uid===S.me.uid?-1:b.uid===S.me.uid?1:b.latest-a.latest);return gs;
}
function storiesHTML(){
  const gs=storyGroups(),mine=gs.find(g=>g.uid===S.me.uid),others=gs.filter(g=>g.uid!==S.me.uid);
  const ringOf=g=>g.latest>(S.seenMap[g.uid]||0)?'new':'seen';
  const me=`<button class="st" data-a="${mine?'story':'addstory'}" ${mine?`data-id="${S.me.uid}"`:''}><span class="plus">${av(S.me.uid,S.me.name,60,mine?ringOf(mine):'seen')}<i data-a="addstory" role="button" aria-label="Story нэмэх">${ic('plus',13)}</i></span><span class="n">Таны story</span></button>`;
  return `<div class="stories" id="stories">${me}${others.map(g=>`<button class="st" data-a="story" data-id="${esc(g.uid)}">${av(g.uid,g.name,60,ringOf(g))}<span class="n">${esc(g.name)}</span></button>`).join('')}</div>`;
}
function postHTML(p){
  const open=S.open.has(p.id),liked=p.likes.includes(S.me.uid),img=safeImg(p.img);
  const cms=open?`<div class="cms">${(S.cm.get(p.id)||[]).map(c=>`<div class="cm">${av(c.uid,c.name,30)}<div class="bb"><b>${esc(c.name)}</b>${esc(c.text)}</div></div>`).join('')}<form class="cmf" data-f="comment" data-id="${esc(p.id)}"><input data-cin="${esc(p.id)}" placeholder="Сэтгэгдэл бичих" aria-label="Сэтгэгдэл бичих" autocomplete="off" maxlength="500"><button class="btn sm" type="submit">Илгээх</button></form></div>`:'';
  const nm=(U.get(p.uid)||{}).name||p.name,uattr=`data-a="user" data-id="${esc(p.uid)}" data-n="${esc(nm)}"`,mine=p.uid===S.me.uid;
  return `<article class="post"><div class="ph"><span ${uattr}>${av(p.uid,nm,42)}</span><div ${uattr}><b>${esc(nm)}</b><span class="mute">${ago(p.t)}${p.ed?' · засварласан':''}</span></div>${mine?`<button class="del" data-a="editpost" data-id="${esc(p.id)}">Засах</button><button class="del" data-a="delpost" data-id="${esc(p.id)}">Устгах</button>`:`<button class="del" data-a="pmenu" data-id="${esc(p.uid)}" data-p="${esc(p.id)}" data-n="${esc(nm)}" aria-label="Цэс">${ic('more',20)}</button>`}</div>${p.text?`<p>${esc(p.text)}</p>`:''}${img?`<div class="art"><img src="${img}" alt=""></div>`:''}<div class="pa"><button data-a="like" data-id="${esc(p.id)}" class="${liked?'liked':''}" aria-pressed="${liked}">${ic('heart',20,liked)}${p.likes.length}</button><button data-a="cm" data-id="${esc(p.id)}">${ic('chat',20)}${p.cc}</button><button data-a="rxo" data-id="${esc(p.id)}" aria-label="Реакц">${ic('smile',20)}</button><span class="rxs">${rxSum(p.rx)}</span></div>${S.rxOpen===p.id?rxPick('p',p.id):''}${cms}</article>`;
}
function postsHTML(){
  let list=S.view?S.vposts:S.tab==='profile'?S.mine:S.posts;
  if(!S.view)list=list.filter(p=>p.uid===S.me.uid||!hid(p.uid));
  const q=S.tab==='feed'&&!S.view?S.pq.trim().toLowerCase():'';
  if(q)list=list.filter(p=>(p.text+' '+p.name).toLowerCase().includes(q));
  return list.length?list.map(postHTML).join(''):`<div class="empty">${q?'Ийм нийтлэл олдсонгүй.':'Нийтлэл байхгүй.'}${!q&&S.tab==='feed'&&!S.view?' Дээрх талбарт анхны нийтлэлээ бич.':''}</div>`;

const AUTH_ERR={'auth/email-already-in-use':'Энэ имэйл бүртгэлтэй байна. Нэвтрэх хэсгээр орно уу.','auth/invalid-email':'Имэйл хаяг буруу байна.','auth/weak-password':'Нууц үг хэт сул байна.','auth/password-does-not-meet-requirements':'Нууц үг хамгийн багадаа 8 тэмдэгт, том үсэг, жижиг үсэг болон тоо агуулсан байх ёстой.','auth/invalid-credential':'Имэйл эсвэл нууц үг буруу байна.','auth/user-not-found':'Имэйл эсвэл нууц үг буруу байна.','auth/wrong-password':'Имэйл эсвэл нууц үг буруу байна.','auth/too-many-requests':'Хэт олон оролдлого хийлээ. Түр хүлээгээд дахин оролдоно уу.','auth/network-request-failed':'Интернэт холболтоо шалгана уу.','auth/operation-not-allowed':'Firebase дээр Email/Password нэвтрэлт идэвхжээгүй байна.','auth/operation-not-supported-in-this-environment':'Файлыг http:// эсвэл https:// хаягаар нээнэ үү (file:// ажиллахгүй).'};
const amsg=(m,ok)=>{A.msg=m;A.ok=!!ok;const e=$('#amsg');if(e){e.textContent=m;e.className=ok?'aok':'aerr'}};
async function doAuth(f){
  const fd=new FormData(f),mode=f.dataset.f,e=(fd.get('e')||'').trim(),p=fd.get('p')||'',btn=f.querySelector('button[type=submit]');
  if(!e)return amsg('Имэйлээ оруулна уу.');
  if(mode==='reset'){btn.disabled=true;try{await AU.sendPasswordResetEmail(auth,e);amsg('Сэргээх холбоосыг имэйл рүү илгээлээ.',true)}catch(x){amsg(AUTH_ERR[x.code]||'Илгээж чадсангүй.')}btn.disabled=false;return}
  if(!p)return amsg('Нууц үгээ оруулна уу.');
  if(mode==='login'){btn.disabled=true;try{await AU.signInWithEmailAndPassword(auth,e,p)}catch(x){amsg(AUTH_ERR[x.code]||'Нэвтэрч чадсангүй. Дахин оролдоно уу.');btn.disabled=false}return}
  const n=(fd.get('n')||'').trim();
  if(!n)return amsg('Нэрээ оруулна уу.');
  if(p.length<8||!/[a-z]/.test(p)||!/[A-Z]/.test(p)||!/[0-9]/.test(p))return amsg('Нууц үг хамгийн багадаа 8 тэмдэгт, том үсэг, жижиг үсэг болон тоо агуулсан байх ёстой.');
  if(p!==(fd.get('p2')||''))return amsg('Хоёр нууц үг таарахгүй байна.');
  btn.disabled=true;regBusy=true;
  try{
    const cred=await AU.createUserWithEmailAndPassword(auth,e,p);
    try{
      await FS.setDoc(FS.doc(db,'users',cred.user.uid),{name:n,nameLower:n.toLowerCase(),bio:'',createdAt:FS.serverTimestamp()});
    }catch(x){regBusy=false;await AU.signOut(auth);amsg('Профайл үүсгэж чадсангүй. Firestore-ийн дүрмээ (rules) шалгана уу.');btn.disabled=false;return}
    regBusy=false;AU.sendEmailVerification(cred.user).catch(()=>{});await startSession(cred.user);
  }catch(x){regBusy=false;amsg(AUTH_ERR[x.code]||'Бүртгэл үүсгэж чадсангүй. Дахин оролдоно уу.');btn.disabled=false}
}

function makeCall(id,peer,name,local,mine){

    S.msgs=sn.docs.map(mapMsg);if(sn.metadata&&sn.metadata.fromCache&&!sn.docs.length&&!S.msgsLoaded)return;S.msgsLoaded=true;if(S.thread&&S.thread.cid===cid){refreshMsgs();markRead(cid)}},onErr);
  markRead(cid);const mi=$('#mi');if(mi&&!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))mi.focus({preventScroll:true});
}
function closeThread(){recStop(false);S.rxOpen=null;if(msgSub){msgSub();msgSub=null}S.thread=null;S.msgs=[];render()}
async function sendMsg(p){if(S.thread)return sendTo(S.thread,p)}
async function sendTo(th,p){
  const {doc,collection,writeBatch,serverTimestamp}=FS,me=S.me,cid=th.cid,b=writeBatch(db);
  const cd={last:p.text?p.text.slice(0,200):p.img?'📷 Зураг':'🎤 Дуут мессеж',lastAt:serverTimestamp(),lastFrom:me.uid};
  if(!th.group){cd.members=[me.uid,th.uid].sort();cd.names={[me.uid]:me.name,[th.uid]:th.name}}
  b.set(doc(db,'chats',cid),cd,{merge:true});
  const md={from:me.uid,fn:me.name,text:p.text||'',createdAt:serverTimestamp()};if(p.img)md.img=p.img;if(p.aud)md.aud=p.aud;
  b.set(doc(collection(db,'chats',cid,'messages')),md);
  await b.commit();
}

/* ---------- дуут мессеж ---------- */
async function recStart(){
  if(rec)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Энэ төхөөрөмж дуу бичихийг дэмжихгүй байна',3000);return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(_){toast('Микрофоны зөвшөөрөл өгнө үү',3500);return}
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000}),chunks=[];
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const r={mr,st,chunks,t0:Date.now(),send:false};rec=r;
  mr.onstop=async()=>{
    st.getTracks().forEach(t=>t.stop());clearInterval(r.iv);if(rec===r)rec=null;if(S.thread)renderMf();
    if(!r.send||!chunks.length)return;
    const blob=new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'});
    if(blob.size>600000){toast('Хэт урт байна');return}
    const d=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});
    try{await sendMsg({aud:d})}catch(_){toast('Илгээж чадсангүй')}
  };
  mr.start();renderMf();
  r.iv=setInterval(()=>{const s=Math.floor((Date.now()-r.t0)/1000),e=$('#rt');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=60)recStop(true)},500);
}
function recStop(send){if(rec){rec.send=send;try{rec.mr.stop()}catch(_){rec=null}}}

/* ---------- үйлдлүүд ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;

    case 'tab':clearView();recStop(false);S.tab=b.dataset.t;S.thread=null;render();$('#main').scrollTop=0;break;

    case 'mrx':S.rxOpen=S.rxOpen===id?null:id;refreshMsgs();break;

      else if(S.thread){const m=S.msgs.find(x=>x.id===id),cur=m&&m.rx[me];refreshMsgs();
        await updateDoc(doc(db,'chats',S.thread.cid,'messages',id),{['rx.'+me]:cur===e2?deleteField():e2})}
      break}
    case 'zoom':{const m=S.msgs.find(x=>x.id===id),im=m&&safeImg(m.img);if(im){ov.innerHTML=`<div class="scrim" data-a="closeov"></div><img class="zoom" src="${im}" alt="">`;ov.className='open'}break}
    case 'rec':recStart();break;
    case 'recsend':recStop(true);break;
    case 'reccancel':recStop(false);break;
    case 'newgroup':{const fr=[...S.friends.entries()].filter(([u])=>!hid(u));
      if(!fr.length){toast('Эхлээд найз нэм');break}
      openSheet(`<h3>Бүлэг үүсгэх</h3><label>Нэр<input id="gn" maxlength="40" placeholder="Бүлгийн нэр"></label><div class="pick">${fr.map(([u,n])=>`<label class="pk"><input type="checkbox" value="${esc(u)}">${av(u,nmOf(u),30)}<span>${esc(nmOf(u))}</span></label>`).join('')}</div><button class="btn" data-a="mkgroup">Үүсгэх</button>`);break}
    case 'mkgroup':{const n=$('#gn').value.trim(),ms=[...document.querySelectorAll('.pick input:checked')].map(x=>x.value);
      if(!n){toast('Бүлгийн нэр бич');break}
      if(!ms.length){toast('Хамгийн багадаа 1 найз сонго');break}
      if(ms.length>19){toast('Хамгийн ихдээ 19 найз');break}
      const gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      await setDoc(doc(db,'chats',gid),{group:true,name:n,members:[S.me.uid,...ms],last:'Бүлэг үүслээ',lastAt:serverTimestamp(),lastFrom:S.me.uid,seen:{}});
      closeOv();openThread(gid,n,gid);break}
    case 'pmenu':openSheet(`<h3>${esc(b.dataset.n)}</h3><button class="btn line" data-a="report" data-id="${esc(id)}" data-p="${esc(b.dataset.p||'')}" data-n="${esc(b.dataset.n)}">Гомдол өгөх</button><button class="btn line" data-a="block" data-id="${esc(id)}">Блоклох</button>`);break;
    case 'report':openSheet(`<h3>Гомдлын шалтгаан</h3>${['Спам','Доромжилсон агуулга','Зохисгүй зураг/текст','Бусад'].map(r=>`<button class="btn line" data-a="doreport" data-id="${esc(id)}" data-p="${esc(b.dataset.p||'')}" data-r="${r}">${r}</button>`).join('')}`);break;
    case 'doreport':{const d={by:S.me.uid,target:id,reason:b.dataset.r,createdAt:serverTimestamp()};if(b.dataset.p)d.postId=b.dataset.p;
      await addDoc(collection(db,'reports'),d);closeOv();toast('Гомдол илгээгдлээ');break}
    case 'block':if(confirm('Энэ хэрэглэгчийг блоклох уу?')){await setDoc(doc(db,'blocks',S.me.uid+'_'+id),{by:S.me.uid,target:id,createdAt:serverTimestamp()});closeOv();toast('Блоклолоо')}break;
    case 'unblock':await deleteDoc(doc(db,'blocks',S.me.uid+'_'+id));closeOv();toast('Блокоос гаргалаа');break;
    case 'ringset':{
      const rs=()=>`<h3>Дуудлагын дуу</h3>${Object.entries(RINGS).map(([k,r])=>`<button class="btn ${RING.tone===k?'':'line'}" data-a="ringtone" data-t="${k}">${r.n}${RING.tone===k?' ✓':''}</button>`).join('')}<label>Дууны хэмжээ<input type="range" id="rvol" min="0.1" max="1" step="0.05" value="${RING.vol}"></label><button class="btn line" data-a="ringtest">▶ Сонсох</button>`;
      openSheet(rs());break}
    case 'ringtone':{RING.tone=b.dataset.t;lsSet('maze-ring',RING);ringStop();ringStart();setTimeout(ringStop,2600);
      document.querySelectorAll('.sheet [data-a="ringtone"]').forEach(x=>{const on=x.dataset.t===RING.tone;x.classList.toggle('line',!on);x.textContent=RINGS[x.dataset.t].n+(on?' ✓':'')});break}
    case 'ringtest':ringStop();ringStart();setTimeout(ringStop,2600);break;
    case 'blocklist':openSheet(`<h3>Блоклосон хэрэглэгчид</h3>${S.blocked.size?[...S.blocked].map(u=>`<div class="row" style="margin:0 0 8px;width:100%">${av(u,nmOf(u),40)}<div class="rt"><b>${esc(nmOf(u))}</b></div><button class="btn sm line" data-a="unblock" data-id="${esc(u)}">Гаргах</button></div>`).join(''):'<p class="mute">Блоклосон хэрэглэгч байхгүй.</p>'}`);break;
    case 'editpost':{const p=allPosts().find(x=>x.id===id);if(!p)break;
      openSheet(`<h3>Нийтлэл засах</h3><textarea id="ep" maxlength="2000">${esc(p.text)}</textarea><button class="btn" data-a="savepost" data-id="${esc(id)}">Хадгалах</button>`);break}
    case 'savepost':{const p=allPosts().find(x=>x.id===id),t=$('#ep').value.trim();
      if(!t&&!(p&&p.img)){toast('Текст хоосон байна');break}
      await updateDoc(doc(db,'posts',id),{text:t,edited:true});closeOv();toast('Хадгалагдлаа');break}
    case 'like':{const p=allPosts().find(x=>x.id===id);if(!p)break;
      await updateDoc(doc(db,'posts',id),{likes:p.likes.includes(S.me.uid)?arrayRemove(S.me.uid):arrayUnion(S.me.uid)});break}
    case 'cm':{
      if(S.open.has(id)){S.open.delete(id);const u=cmSubs.get(id);if(u){u();cmSubs.delete(id)}refreshPosts();break}
      S.open.add(id);refreshPosts();
      cmSubs.set(id,onSnapshot(query(collection(db,'posts',id,'comments'),orderBy('createdAt','asc'),limit(100)),sn=>{
        S.cm.set(id,sn.docs.map(d=>{const x=d.data();return {id:d.id,uid:x.uid,name:x.name||'',text:x.text||''}}));refreshPosts()},onErr));
      const i=document.querySelector(`[data-cin="${CSS.escape(id)}"]`);if(i)i.focus();break}
    case 'delpost':if(confirm('Энэ нийтлэлийг устгах уу?')){await deleteDoc(doc(db,'posts',id));toast('Устгагдлаа')}break;
    case 'story':{const gs=storyGroups(),gi=gs.findIndex(g=>g.uid===id);if(gi<0)break;S.sv={groups:gs,gi,i:0};drawStory();break}
    case 'sprev':prevStory();break;
    case 'snext':nextStory();break;
    case 'closeov':closeOv();break;
    case 'call':startCall(S.thread.uid,S.thread.name);break;
    case 'cacc':acceptCall();break;
    case 'cdec':declineCall();break;
    case 'cend':endCall(true);break;
    case 'cplay':{const x=b;document.querySelectorAll('.call video').forEach(v=>v.play().catch(()=>{}));x.remove();break}
    case 'cmute':toggleTrack('audio',b);break;
    case 'ccam':toggleTrack('video',b);break;
    case 'addstory':
      S.gsel=0;openSheet(`<h3>Story нэмэх</h3><label>Текст<textarea id="st-t" maxlength="120" placeholder="Юу хуваалцах вэ?"></textarea></label><div class="sw">${GR.map((g,i)=>`<button data-a="grad" data-i="${i}" class="${i===0?'on':''}" style="background:${g}" aria-label="Өнгө ${i+1}"></button>`).join('')}</div><button class="btn" data-a="savestory">Story нийтлэх</button>`);break;
    case 'grad':S.gsel=+b.dataset.i;document.querySelectorAll('.sw button').forEach((x,i)=>x.classList.toggle('on',i===S.gsel));break;
    case 'savestory':{const t=$('#st-t').value.trim();if(!t){toast('Текст бич');break}
      await addDoc(collection(db,'stories'),{uid:S.me.uid,name:S.me.name,text:t,g:S.gsel,createdAt:serverTimestamp()});closeOv();toast('Story нийтлэгдлээ');break}
    case 'add':{const to=id,nm=b.dataset.n;
      await setDoc(doc(db,'requests',S.me.uid+'_'+to),{from:S.me.uid,to,fromName:S.me.name,toName:nm,status:'pending',createdAt:serverTimestamp()});toast('Хүсэлт илгээгдлээ');break}
    case 'accept':{const r=S.reqIn.find(x=>x.id===id);if(!r)break;const me=S.me.uid,bt=writeBatch(db);
      bt.update(doc(db,'requests',id),{status:'accepted'});
      bt.set(doc(db,'friendships',chatId(me,r.from)),{members:[me,r.from].sort(),names:{[me]:S.me.name,[r.from]:r.fromName},createdAt:serverTimestamp()});
      await bt.commit();toast(r.fromName+' найз боллоо');break}

      const bio=$('#pb').value.trim(),up={name:n,nameLower:n.toLowerCase(),bio};if(S.draftPhoto)up.photo=S.draftPhoto;

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();
  const k=f.dataset.f;
  if(k==='login'||k==='register'||k==='reset'){doAuth(f);return}
  if(!S.me)return;
  const {doc,addDoc,collection,writeBatch,serverTimestamp,increment}=FS;
  try{
    if(k==='post'){
      const t=$('#cmp').value.trim();if(!t&&!S.draftImg){toast('Текст эсвэл зураг нэм');return}
      const data={uid:S.me.uid,name:S.me.name,text:t,createdAt:serverTimestamp(),likes:[],cc:0};if(S.draftImg)data.img=S.draftImg;
      $('#cmp').value='';S.draftImg=null;$('#prev').innerHTML='';
      await addDoc(collection(db,'posts'),data);toast('Нийтлэгдлээ');
    }
    if(k==='comment'){
      const id=f.dataset.id,inp=f.querySelector('input'),t=inp.value.trim();if(!t)return;inp.value='';
      const bt=writeBatch(db);
      bt.set(doc(collection(db,'posts',id,'comments')),{uid:S.me.uid,name:S.me.name,text:t,createdAt:serverTimestamp()});
      bt.update(doc(db,'posts',id),{cc:increment(1)});
      await bt.commit();
    }
    if(k==='msg'){
      const inp=$('#mi'),t=inp?inp.value.trim():'';if(!t)return;inp.value='';
      try{await sendMsg({text:t})}catch(x){inp.value=t;throw x}
    }
  }catch(err){console.error(err);toast('Илгээж чадсангүй. Дахин оролдоно уу.',3000)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='rvol'){RING.vol=+e.target.value;lsSet('maze-ring',RING)}
  if(e.target.id==='fq'){S.q=e.target.value;refreshFriends()}
  if(e.target.id==='pq'){S.pq=e.target.value;refreshPosts()}
  if(e.target.id==='cq'){S.cq=e.target.value;refreshChats()}
});
document.addEventListener('visibilitychange',()=>{if(S.me&&S.thread&&!document.hidden)markRead(S.thread.cid)});
document.addEventListener('change',async e=>{
  if(e.target.id==='file'){
    const f=e.target.files[0];if(!f)return;
    try{const d=await downscale(f);S.draftImg=d;$('#prev').innerHTML=`<img src="${d}" alt="Сонгосон зураг">`}catch(_){toast('Зураг уншигдсангүй')}
  }
  if(e.target.id==='mfile'){
    const f=e.target.files[0];if(!f||!S.thread)return;
    try{const d=await downscale(f);await sendMsg({img:d})}catch(_){toast('Зураг илгээж чадсангүй')}
    e.target.value='';
  }
  if(e.target.id==='pfile'){
    const f=e.target.files[0];if(!f)return;
    try{S.draftPhoto=await cropSq(f,160);toast('Зураг сонгогдлоо. Хадгалах дарна уу.')}catch(_){toast('Зураг уншигдсангүй')}
  }
});

/* ---------- эхлүүлэлт ---------- */
async function main(){
  try{const t=localStorage.getItem('nutag-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
  if(!configured&&!window.__FB_MOCK){setupRender();return}
  $('#main').innerHTML='<div class="empty">Ачаалж байна…</div>';
  try{
    const fb=await loadFirebase();
    const app=fb.app.initializeApp(CFG);FBAPP=app;AU=fb.auth;FS=fb.fs;auth=AU.getAuth(app);db=FS.getFirestore(app);
  }catch(e){console.error(e);$('#main').innerHTML='<div class="empty">Firebase ачаалж чадсангүй. Интернэт холболтоо шалгаад хуудсаа дахин ачаална уу.</div>';return}
  AU.onAuthStateChanged(auth,async u=>{
    if(regBusy)return;
    if(u)await startSession(u);else{endSession();render()}
  });
}
main();
startUpdater();
